<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026世界杯冠军预测</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #0a0a1a;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, #0a0a1a 70%);
  z-index: 0; overflow: hidden;
}
.bg-stars::before, .bg-stars::after {
  content: ''; position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background-image:
    radial-gradient(2px 2px at 20px 30px, #eee, transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
  background-repeat: repeat; background-size: 200px 100px;
  animation: twinkle 4s ease-in-out infinite alternate;
}
.bg-stars::after { animation-delay: 2s; opacity: 0.5; }
@keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.8; } }

.container {
  position: relative; z-index: 1;
  max-width: 420px; margin: 0 auto;
  min-height: 100vh; padding: 0 16px;
}

.page { display: none; animation: fadeUp 0.6s ease; }
.page.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========= 页面1: 选队+填名字合并 ========= */
.main-page { padding-top: 28px; padding-bottom: 40px; text-align: center; }

.trophy-icon {
  width: 90px; height: 90px; margin: 0 auto 16px;
  background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 46px;
  box-shadow: 0 0 60px rgba(255,215,0,0.3), 0 0 120px rgba(255,165,0,0.15);
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 60px rgba(255,215,0,0.3); }
  50% { box-shadow: 0 0 80px rgba(255,215,0,0.5), 0 0 120px rgba(255,165,0,0.3); }
}

.main-title {
  font-size: 26px; font-weight: 900;
  background: linear-gradient(135deg, #FFD700, #FF6B35, #FFD700);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px; letter-spacing: 2px;
}
.sub-title {
  font-size: 13px; color: rgba(255,255,255,0.45);
  margin-bottom: 20px; letter-spacing: 1px;
}

.section-label {
  font-size: 13px; color: rgba(255,255,255,0.55);
  margin-bottom: 10px; letter-spacing: 1px;
  text-align: left; padding-left: 4px;
}

.input-group { margin: 0 0 20px; position: relative; }
.input-group input {
  width: 100%; padding: 13px 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px; color: #fff;
  font-size: 16px; font-family: inherit;
  outline: none; transition: all 0.3s;
}
.input-group input:focus {
  border-color: #FFD700;
  background: rgba(255,215,0,0.05);
  box-shadow: 0 0 20px rgba(255,215,0,0.1);
}
.input-group input::placeholder { color: rgba(255,255,255,0.25); }

.team-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px; padding: 0; margin-bottom: 20px;
}

.team-card {
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 12px 4px 10px;
  text-align: center; cursor: pointer;
  transition: all 0.3s; position: relative; overflow: hidden;
}
.team-card::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, var(--tc1, transparent), var(--tc2, transparent));
  opacity: 0; transition: opacity 0.3s;
}
.team-card:hover::before, .team-card.selected::before { opacity: 0.15; }
.team-card:hover, .team-card.selected {
  border-color: var(--tc1, #FFD700);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
.team-card.selected { box-shadow: 0 0 20px var(--tc1, rgba(255,215,0,0.3)); }
.team-flag {
  font-size: 30px; margin-bottom: 4px;
  position: relative; z-index: 1;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}
.team-name {
  font-size: 11px; font-weight: 600;
  position: relative; z-index: 1; letter-spacing: 0.5px;
}
.team-card.china-special {
  background: rgba(255,50,50,0.08);
  border-color: rgba(255,50,50,0.2);
  animation: chinaGlow 2s ease-in-out infinite;
}
@keyframes chinaGlow {
  0%, 100% { box-shadow: 0 0 5px rgba(255,50,50,0.1); }
  50% { box-shadow: 0 0 15px rgba(255,50,50,0.2); }
}
.china-tag {
  position: absolute; top: 3px; right: 3px;
  background: linear-gradient(135deg, #ff4444, #cc0000);
  font-size: 8px; padding: 2px 4px;
  border-radius: 4px; z-index: 2;
  font-weight: 700; letter-spacing: 0.5px;
}

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center;
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, #FFD700, #FF8C00);
  border: none; border-radius: 50px;
  color: #1a1a2e; font-size: 17px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  letter-spacing: 2px; transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(255,215,0,0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255,215,0,0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.footer-note {
  font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 16px;
}

/* ========= 页面2: 海报结果页 ========= */
.result-page { padding-top: 16px; padding-bottom: 40px; }

.poster-wrapper {
  margin: 0 auto 20px;
  max-width: 360px;
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.poster {
  width: 100%; position: relative; overflow: hidden;
  background: #0d1117;
}

/* 海报背景层 */
.poster-bg-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
}
.poster-bg-gradient {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(160deg, var(--pc1, #1a237e), var(--pc2, #0d47a1), var(--pc3, #01579b));
}
/* 光晕效果 */
.poster-bg-glow {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background:
    radial-gradient(ellipse at 50% 15%, rgba(255,215,0,0.15) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 80%, rgba(255,255,255,0.06) 0%, transparent 40%),
    radial-gradient(ellipse at 80% 60%, rgba(255,255,255,0.04) 0%, transparent 35%);
}
/* 球场线条 SVG */
.poster-stadium {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 55%;
  z-index: 1; opacity: 0.07;
}
/* 底部暗角 */
.poster-vignette {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.5) 100%);
  z-index: 2;
}
/* 奖杯装饰 */
.poster-trophy-bg {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1; opacity: 0.06;
  font-size: 280px;
  line-height: 1;
  filter: blur(2px);
}
/* 金色光线 */
.poster-rays {
  position: absolute; top: -20%; left: 50%;
  transform: translateX(-50%);
  width: 200%; height: 60%;
  z-index: 1;
  background: conic-gradient(
    from 0deg at 50% 100%,
    transparent 0deg, rgba(255,215,0,0.04) 10deg,
    transparent 20deg, rgba(255,215,0,0.03) 30deg,
    transparent 40deg, rgba(255,215,0,0.04) 50deg,
    transparent 60deg, rgba(255,215,0,0.03) 70deg,
    transparent 80deg, rgba(255,215,0,0.04) 90deg,
    transparent 100deg, rgba(255,215,0,0.03) 110deg,
    transparent 120deg, rgba(255,215,0,0.04) 130deg,
    transparent 140deg, rgba(255,215,0,0.03) 150deg,
    transparent 160deg, rgba(255,215,0,0.04) 170deg,
    transparent 180deg
  );
}
/* 金色粒子点缀 */
.poster-sparkles {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 2;
  background-image:
    radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,215,0,0.6), transparent),
    radial-gradient(1px 1px at 80% 15%, rgba(255,215,0,0.5), transparent),
    radial-gradient(1.5px 1.5px at 70% 35%, rgba(255,215,0,0.4), transparent),
    radial-gradient(1px 1px at 25% 65%, rgba(255,215,0,0.5), transparent),
    radial-gradient(2px 2px at 90% 55%, rgba(255,215,0,0.3), transparent),
    radial-gradient(1px 1px at 40% 85%, rgba(255,215,0,0.4), transparent),
    radial-gradient(1.5px 1.5px at 60% 75%, rgba(255,215,0,0.35), transparent),
    radial-gradient(1px 1px at 10% 45%, rgba(255,215,0,0.5), transparent),
    radial-gradient(2px 2px at 50% 10%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 85% 80%, rgba(255,215,0,0.3), transparent);
}

.poster-content {
  position: relative; z-index: 10;
  padding: 28px 22px 24px;
  text-align: center;
}

.poster-top-line {
  font-size: 10px; letter-spacing: 4px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 2px; font-weight: 500;
}
.poster-top-sub {
  font-size: 9px; letter-spacing: 2px;
  color: rgba(255,255,255,0.25);
  margin-bottom: 14px;
}

.poster-trophy-icon {
  font-size: 52px;
  margin-bottom: 6px;
  filter: drop-shadow(0 0 20px rgba(255,215,0,0.4));
}

/* 冠军大标题 */
.poster-champion-title {
  margin-bottom: 6px;
  position: relative; display: inline-block;
}
.poster-champion-title h1 {
  font-size: 32px; font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(180deg, #FFFACD 0%, #FFD700 40%, #DAA520 70%, #B8860B 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  line-height: 1.3;
}
.poster-champion-sub {
  font-size: 11px; letter-spacing: 6px; font-weight: 700;
  color: #FFD700;
  margin-bottom: 4px;
  text-shadow: 0 0 10px rgba(255,215,0,0.3);
}
.poster-champion-year {
  font-size: 28px; font-weight: 900;
  letter-spacing: 8px;
  background: linear-gradient(180deg, #FFF8DC, #FFD700, #B8860B);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.3));
  margin-bottom: 10px;
}

.poster-flag-wrap {
  margin-bottom: 6px;
}
.poster-flag {
  font-size: 64px;
  filter: drop-shadow(0 4px 15px rgba(0,0,0,0.4));
}
.poster-team-name {
  font-size: 22px; font-weight: 900;
  letter-spacing: 3px; margin-bottom: 2px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
.poster-team-en {
  font-size: 10px; letter-spacing: 3px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 14px;
  text-transform: uppercase;
}

.poster-divider {
  width: 80px; height: 2px; margin: 0 auto 14px;
  background: linear-gradient(90deg, transparent, #FFD700, transparent);
}

.poster-quote {
  font-size: 14px; line-height: 1.8;
  color: rgba(255,255,255,0.9);
  margin-bottom: 14px; padding: 0 6px;
  font-weight: 500;
}

.poster-meme {
  font-size: 11px; line-height: 1.7;
  color: rgba(255,255,255,0.5);
  padding: 10px 14px;
  background: rgba(255,255,255,0.06);
  border-radius: 10px;
  margin-bottom: 16px;
  font-style: italic;
  border-left: 2px solid rgba(255,215,0,0.3);
  text-align: left;
}

.poster-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.poster-footer-left { text-align: left; }
.poster-footer-tag {
  font-size: 8px; letter-spacing: 2px;
  color: rgba(255,255,255,0.3);
}
.poster-footer-date {
  font-size: 9px; color: rgba(255,255,255,0.2); margin-top: 2px;
}
.poster-footer-right {
  display: flex; align-items: center; gap: 8px;
}
.poster-footer-cup {
  font-size: 20px; opacity: 0.6;
}
.poster-qr-wrap {
  display: flex; align-items: center; gap: 6px;
}
.poster-qr-box {
  padding: 3px; background: #fff; border-radius: 4px;
  line-height: 0; display: inline-block;
}
#posterQrcode canvas { display: block !important; }
#posterQrcode img { display: none !important; }
.poster-qr-label {
  font-size: 7px; color: rgba(255,255,255,0.35);
  letter-spacing: 0.5px; line-height: 1.3;
  text-align: left;
}

/* 操作按钮区 */
.action-area { padding: 0 6px; }

.cta-button {
  display: block; width: 100%; padding: 16px;
  background: linear-gradient(135deg, #FF4444, #FF1744, #D50000);
  border: none; border-radius: 14px;
  color: #fff; font-size: 17px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  letter-spacing: 2px; margin-bottom: 12px;
  position: relative; overflow: hidden;
  box-shadow: 0 4px 20px rgba(255,23,68,0.4);
  animation: ctaPulse 2s ease-in-out infinite;
}
@keyframes ctaPulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(255,23,68,0.4); }
  50% { box-shadow: 0 4px 35px rgba(255,23,68,0.6); }
}
.cta-button::before {
  content: ''; position: absolute;
  top: -50%; left: -50%; width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
  animation: shine 3s ease-in-out infinite;
}
@keyframes shine {
  0% { transform: translateX(-100%) rotate(45deg); }
  100% { transform: translateX(100%) rotate(45deg); }
}
.cta-sub { font-size: 11px; font-weight: 400; opacity: 0.8; display: block; margin-top: 4px; letter-spacing: 1px; }

.action-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 12px;
}
.btn-action {
  padding: 13px 12px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  color: #fff; font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer;
  transition: all 0.3s; letter-spacing: 1px;
}
.btn-action:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.2);
}
.btn-action .btn-icon { font-size: 18px; margin-bottom: 4px; display: block; }

.btn-save {
  display: block; width: 100%; padding: 13px;
  background: rgba(255,215,0,0.1);
  border: 1px solid rgba(255,215,0,0.25);
  border-radius: 12px;
  color: #FFD700; font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer;
  transition: all 0.3s; letter-spacing: 1px; margin-bottom: 16px;
}
.btn-save:hover { background: rgba(255,215,0,0.15); }


/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.85); color: #fff;
  padding: 12px 24px; border-radius: 10px;
  font-size: 14px; z-index: 100;
  opacity: 0; transition: all 0.3s;
  pointer-events: none; backdrop-filter: blur(10px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 加载动画 */
.loading-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(10,10,26,0.9);
  display: none; align-items: center; justify-content: center;
  z-index: 50; flex-direction: column;
}
.loading-overlay.show { display: flex; }
.loading-spinner {
  width: 50px; height: 50px;
  border: 3px solid rgba(255,215,0,0.2);
  border-top-color: #FFD700;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: rgba(255,255,255,0.6); letter-spacing: 2px; }

/* 撒花 */
.confetti-container {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 30; overflow: hidden;
}
.confetti {
  position: absolute; top: -20px;
  width: 10px; height: 10px; opacity: 0;
  animation: fall linear forwards;
}
@keyframes fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}
</style>
</head>
<body>

<div class="bg-stars"></div>
<div class="confetti-container" id="confettiContainer"></div>

<div class="container">
  <!-- ===== 页面1: 选队+名字合并页 ===== -->
  <div class="page active" id="page1">
    <div class="main-page">
      <div class="trophy-icon">🏆</div>
      <div class="main-title">2026世界杯冠军预测</div>
      <div class="sub-title">FIFA WORLD CUP 2026 · 美加墨</div>

      <div class="section-label">🔮 选出你心中的冠军</div>
      <div class="team-grid" id="teamGrid"></div>

      <div class="section-label" style="margin-top:4px;">✍️ 你的名字</div>
      <div class="input-group">
        <input type="text" id="userName" placeholder="输入你的名字，预言家" maxlength="10">
      </div>

      <button class="btn-primary" id="btnGenerate" disabled onclick="generatePoster()">
        生成我的预测海报 →
      </button>

      <p class="footer-note">无需登录 · 人人可参与 · 纯属娱乐</p>
    </div>
  </div>

  <!-- ===== 页面2: 海报结果页 ===== -->
  <div class="page" id="page2">
    <div class="result-page">
      <div class="poster-wrapper">
        <div class="poster" id="poster">
          <!-- 多层背景 -->
          <div class="poster-bg-layer">
            <div class="poster-bg-gradient" id="posterBg"></div>
            <div class="poster-bg-glow"></div>
            <div class="poster-rays"></div>
            <!-- 球场线条 SVG -->
            <svg class="poster-stadium" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice">
              <!-- 球场草坪线 -->
              <rect x="20" y="10" width="360" height="200" rx="8" fill="none" stroke="white" stroke-width="2"/>
              <line x1="200" y1="10" x2="200" y2="210" stroke="white" stroke-width="1.5"/>
              <circle cx="200" cy="110" r="40" fill="none" stroke="white" stroke-width="1.5"/>
              <circle cx="200" cy="110" r="3" fill="white"/>
              <!-- 左禁区 -->
              <rect x="20" y="55" width="60" height="110" fill="none" stroke="white" stroke-width="1.5"/>
              <rect x="20" y="80" width="25" height="60" fill="none" stroke="white" stroke-width="1"/>
              <circle cx="55" cy="110" r="2" fill="white"/>
              <!-- 右禁区 -->
              <rect x="320" y="55" width="60" height="110" fill="none" stroke="white" stroke-width="1.5"/>
              <rect x="355" y="80" width="25" height="60" fill="none" stroke="white" stroke-width="1"/>
              <circle cx="345" cy="110" r="2" fill="white"/>
              <!-- 角旗 -->
              <path d="M20,14 Q20,10 24,10" fill="none" stroke="white" stroke-width="1"/>
              <path d="M376,10 Q380,10 380,14" fill="none" stroke="white" stroke-width="1"/>
              <path d="M20,206 Q20,210 24,210" fill="none" stroke="white" stroke-width="1"/>
              <path d="M376,210 Q380,210 380,206" fill="none" stroke="white" stroke-width="1"/>
            </svg>
            <div class="poster-trophy-bg">🏆</div>
            <div class="poster-sparkles"></div>
            <div class="poster-vignette"></div>
          </div>

          <div class="poster-content">
            <div class="poster-top-line">FIFA WORLD CUP</div>
            <div class="poster-top-sub">CHAMPION PREDICTION</div>

            <div class="poster-trophy-icon">🏆</div>

// ========== 状态 ==========
let userName = '';
let selectedTeam = null;

// ========== 初始化 ==========
function initTeamGrid() {
  const grid = document.getElementById('teamGrid');
  grid.innerHTML = '';
  teams.forEach(team => {
    const card = document.createElement('div');
    card.className = 'team-card' + (team.special ? ' china-special' : '');
    card.style.setProperty('--tc1', team.cardColors[0]);
    card.style.setProperty('--tc2', team.cardColors[1]);
    card.dataset.id = team.id;
    card.innerHTML = `
      <div class="team-flag">${team.flag}</div>
      <div class="team-name">${team.name}</div>
      ${team.special ? '<div class="china-tag">梦想队</div>' : ''}
    `;
    card.onclick = () => selectTeam(team.id, card);
    grid.appendChild(card);
  });
}

function selectTeam(id, el) {
  document.querySelectorAll('.team-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedTeam = teams.find(t => t.id === id);
  checkReady();
}

function checkReady() {
  const name = document.getElementById('userName').value.trim();
  document.getElementById('btnGenerate').disabled = !(name && selectedTeam);
}

function showPage(n) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + n).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ========== 生成海报 ==========
function generatePoster() {
  userName = document.getElementById('userName').value.trim();
  if (!userName || !selectedTeam) return;

  const loading = document.getElementById('loading');
  loading.classList.add('show');

  setTimeout(() => {
    const data = teamQuotes[selectedTeam.id];
    const quote = data.quotes[Math.floor(Math.random() * data.quotes.length)](userName);
    const meme = data.memes[Math.floor(Math.random() * data.memes.length)];

    // 设置海报颜色
    document.getElementById('posterBg').style.background =
      `linear-gradient(160deg, ${selectedTeam.colors[0]}, ${selectedTeam.colors[1]}, ${selectedTeam.colors[2]})`;

    document.getElementById('posterFlag').textContent = selectedTeam.flag;
    document.getElementById('posterTeam').textContent = selectedTeam.name;
    document.getElementById('posterTeamEn').textContent = selectedTeam.nameEn;
    document.getElementById('posterQuote').textContent = quote;
    document.getElementById('posterMeme').textContent = meme;

    const now = new Date();
    document.getElementById('posterDate').textContent =
      `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;

    // 生成海报内二维码（小尺寸）
    const qrDiv = document.getElementById('posterQrcode');
    qrDiv.innerHTML = '';
    new QRCode(qrDiv, {
      text: QR_LINK,
      width: 56,
      height: 56,
      colorDark: '#1a1a2e',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    loading.classList.remove('show');
    showPage(2);
    launchConfetti();
  }, 1200);
}

// ========== 撒花 ==========
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#FFD700','#FF6B35','#FF1744','#00E676','#2979FF','#FF4081','#FFEA00'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = Math.random() * 100;
    const size = 6 + Math.random() * 10;
    const duration = 2 + Math.random() * 3;
    const delay = Math.random() * 2;
    const shape = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.cssText = `
      left:${left}%; width:${size}px; height:${size}px;
      background:${color}; border-radius:${shape};
      animation-duration:${duration}s; animation-delay:${delay}s;
    `;
    container.appendChild(piece);
  }
  setTimeout(() => container.innerHTML = '', 6000);
}

// ========== 保存海报 ==========
function savePoster() {
  showToast('正在生成图片...');
  html2canvas(document.getElementById('poster'), {
    scale: 2, useCORS: true, backgroundColor: null, logging: false,
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `世界杯预测_${userName}_${selectedTeam.name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('海报已保存！');
  }).catch(() => showToast('保存失败，请长按截图保存'));
}

// ========== 分享 ==========
function sharePoster() {
  if (navigator.share) {
    navigator.share({
      title: '2026世界杯冠军预测',
      text: `我是${userName}，我预测${selectedTeam.name}将夺得2026世界杯冠军！你觉得呢？来做你的预测吧！`,
      url: window.location.href,
    }).catch(() => {});
  } else {
    const text = `我是${userName}，我预测${selectedTeam.name}将夺得2026世界杯冠军！来做你的预测吧！${window.location.href}`;
    navigator.clipboard.writeText(text).then(() => {
      showToast('分享文案已复制到剪贴板！');
    }).catch(() => showToast('请手动复制链接分享'));
  }
}

// ========== 重新预测 ==========
function resetAll() {
  selectedTeam = null;
  document.querySelectorAll('.team-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('btnGenerate').disabled = true;
  showPage(1);
}

// ========== Toast ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ========== 启动 ==========
document.addEventListener('DOMContentLoaded', () => {
  initTeamGrid();
  document.getElementById('userName').addEventListener('input', checkReady);
});
</script>
